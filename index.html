      '<div class="bal-leg"><span><i style="background:var(--pino)"></i>' + (val ? "Vendas" : "Saídas") + '</span><span><i style="background:var(--suave);opacity:.45"></i>' + (val ? "Compras" : "Entradas") + '</span></div><div id="balGraf">' + svgBarras(d) + "</div>" +
      (val && d.semPreco ? '<p class="bal-nota">' + d.semPreco + " saída(s) sem preço não entram nos valores.</p>" : "") + "</div>";
    h += '<div class="bal-card"><h3>O que mais sai' + (val ? " (em R$)" : "") + '</h3><p class="sub">' + (com.length === 1 ? "O único produto que " + (val ? "faturou" : "saiu") : "Os " + Math.min(10, com.length) + " produtos que mais " + (val ? "faturaram" : "saíram")) + " em " + esc(titulo) + ".</p>" +
      (com.length ? '<div class="bal-rank">' + com.slice(0, 10).map(r => linhaRank(r, maxK, false, val)).join("") + "</div>" : '<div class="bal-vazio">Nenhuma saída no período.</div>') + "</div>";
    h += '<div class="bal-card"><h3>O que sai pouco ou está parado</h3><p class="sub">' + (parados.length ? parados.length + (parados.length === 1 ? " produto não teve" : " produtos não tiveram") + " nenhuma saída. " : "") + "Os que menos " + (val ? "faturaram" : "saíram") + ", para você rever compra ou preço.</p>" +
      '<div class="bal-rank">' + poucos.map(r => linhaRank(r, maxK, true, val)).join("") + "</div></div>";
    h += '<div class="bal-card"><details><summary>Ver tabela completa</summary><table class="bal-tab"><thead><tr><th>Produto</th><th>Saídas</th><th>Vendas</th><th>Entradas</th><th>Estoque</th></tr></thead><tbody>' +
      d.itens.slice().sort((a, b) => b.s - a.s || a.p.nome.localeCompare(b.p.nome, "pt-BR")).map(r => "<tr><td>" + esc(r.p.nome) + "</td><td>" + fmt(arred(r.s)) + "</td><td>" + (r.v > 0 ? reais(r.v) : "—") + "</td><td>" + fmt(arred(r.e)) + "</td><td>" + fmt(saldoDe(r.p.id)) + " " + esc(r.p.unidade) + "</td></tr>").join("") + "</tbody></table></details></div>";
  }
  h += '<p class="bal-nota">Quantidades na unidade de cada produto (un, kg…). As entradas não contam o estoque inicial do cadastro. Movimentos antigos sem valor usam o preço atual do produto.</p>';
  el.innerHTML = h;
}
(() => {
  const tip = document.createElement("div"); tip.id = "balTip"; tip.setAttribute("aria-hidden", "true"); document.body.appendChild(tip);
  const mostra = (e, t) => { tip.innerHTML = t.split("|").map((x, i) => i ? esc(x) : "<b>" + x + "</b>").join("<br>"); tip.style.display = "block"; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, e.clientX + 14)) + "px"; tip.style.top = Math.max(6, Math.min(innerHeight - h - 6, e.clientY + 14)) + "px"; };
  const v = document.getElementById("vBal");
  v.addEventListener("pointermove", e => { const t = e.target.closest("[data-tip]"); if(t) mostra(e, t.getAttribute("data-tip")); else tip.style.display = "none"; });
  v.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  v.addEventListener("click", e => {
    const bm = e.target.closest("[data-bm]"), bn = e.target.closest("[data-bn]");
    const bd = e.target.closest("[data-bd]");
    if(bd){ balMed = bd.dataset.bd; tip.style.display = "none"; renderBalanco(); }
    else if(bm){ balModo = bm.dataset.bm; tip.style.display = "none"; renderBalanco(); }
    else if(bn && !bn.disabled){ const k = Number(bn.dataset.bn); if(balModo === "ano") balRef.setFullYear(balRef.getFullYear() + k); else balRef.setMonth(balRef.getMonth() + k); tip.style.display = "none"; renderBalanco(); }
  });
  window.addEventListener("resize", () => { if(aba === "bal") renderBalanco(); });
})();

function posicionarThumb(instantaneo){
  const b = document.querySelector('.seg [aria-selected="true"]'), t = $("#thumb");
  if(!b) return;
  if(instantaneo) t.style.transition = "none";
  t.style.width = b.offsetWidth + "px";
  t.style.transform = "translateX(" + b.offsetLeft + "px)";
  if(instantaneo){ void t.offsetWidth; t.style.transition = ""; }
}
function mudarAba(nova){
  if(nova === aba) return;
  aba = nova;
  const ve = $("#vEstoque"), vh = $("#vHist"), vb = $("#vBal");
  ve.hidden = nova !== "estoque"; vh.hidden = nova !== "hist"; vb.hidden = nova !== "bal";
  $("#tEstoque").setAttribute("aria-selected", String(nova === "estoque"));
  $("#tHist").setAttribute("aria-selected", String(nova === "hist"));
  $("#tBal").setAttribute("aria-selected", String(nova === "bal"));
  posicionarThumb();
  const alvo = nova === "estoque" ? ve : nova === "bal" ? vb : vh;
  alvo.classList.remove("troca"); void alvo.offsetWidth; alvo.classList.add("troca");
  render();
}
$("#tEstoque").onclick = () => mudarAba("estoque");
$("#tHist").onclick = () => mudarAba("hist");
$("#tBal").onclick = () => mudarAba("bal");
window.addEventListener("resize", posicionarThumb);
window.addEventListener("load", posicionarThumb);

const dt = new Date().toLocaleDateString("pt-BR", {weekday: "long", day: "numeric", month: "long"});
dataBase = dt.charAt(0).toUpperCase() + dt.slice(1);
$("#dataHoje").textContent = dataBase;
aplicarAp();
render("inicial");
posicionarThumb(true);
iniciarLicenca();
iniciarSync();
