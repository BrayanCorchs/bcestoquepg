<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#203A52">
<title>BC Vertex Estoque</title>
<style>
*{box-sizing:border-box}
:root{
  --topo:#203A52; --fundo:#EEF2F6; --painel:#FFFFFF; --campo:#FFFFFF;
  --tinta:#18232D; --suave:#596B7A; --linha:#D8E0E7; --linha2:#E7EDF2; --trilho:#E0E7ED;
  --pino:#0B78B8; --pino-h:#08639A; --anel:rgba(0,170,240,.24); --pulso:#D6EEFB;
  --azul:#00AAF0; --azul-bg:#DDF1FC; --azul-tx:#0A6AA3;
  --ok:#1F7A55; --ok-bg:#DCF0E5; --alerta:#94570A; --alerta-bg:#FCEBCB; --perigo:#B3321F; --perigo-bg:#FBDDD8;
  --b-ok:#2FA272; --b-repor:#E0A019; --b-sem:#D64B39;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --topo:#0E1C29; --fundo:#0C1319; --painel:#15202A; --campo:#0E171F;
    --tinta:#E6EEF4; --suave:#9AAEBD; --linha:#263643; --linha2:#1D2A35; --trilho:#25343F;
    --pino:#1B7DBE; --pino-h:#2590D6; --anel:rgba(0,170,240,.34); --pulso:#173A52;
    --azul:#2DB6F5; --azul-bg:#15364D; --azul-tx:#6CC8F5;
    --ok:#5ED0A0; --ok-bg:#173A2C; --alerta:#F2B84B; --alerta-bg:#3D2E12; --perigo:#FF9C8F; --perigo-bg:#3F1D19;
  }
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font:16px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid #5BB8F0;outline-offset:2px}


/* ---------- leitura por foto ---------- */
.cam{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#111;border-radius:14px;margin:0 0 8px}
.cam[hidden]{display:none}
.dlg input[hidden]{display:none}
.plGrande{font-size:15px;line-height:1.5;color:var(--tinta,inherit);margin:12px 0}#plAj{margin:8px 0}#plAj summary{cursor:pointer;font-weight:600;padding:6px 0}
.dlg details summary{cursor:pointer;font-weight:600;padding:8px 0}.dlg [hidden]{display:none}
/* ---------- balanço ---------- */
.bal-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 16px}
.bal-top .modo{margin:0}.bal-top .modo button{padding:0 18px}
.bal-nav{display:flex;align-items:center;gap:6px}
.bal-nav button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--linha);background:var(--painel);cursor:pointer;font-size:20px;line-height:1;color:var(--tinta)}
.bal-nav button:disabled{opacity:.35;cursor:default}
.bal-nav b{min-width:150px;text-align:center;font-size:17px}
.bal-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.bal-tile{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:14px 16px}
.bal-tile small{display:block;color:var(--suave);font-size:13px}
.bal-tile b{display:block;font-size:26px;line-height:1.2;margin-top:2px}
.bal-tile em{font-style:normal;font-size:13px;color:var(--suave)}
.bal-card{background:var(--painel);border:1px solid var(--linha);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.bal-card h3{margin:0 0 2px;font-size:17px}.bal-card .sub{margin:0 0 12px;color:var(--suave);font-size:14px}
.bal-leg{display:flex;gap:16px;font-size:13px;color:var(--suave);margin:0 0 6px}
.bal-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bal-svg{width:100%;height:auto;display:block;overflow:visible}
.bal-svg text{fill:var(--suave);font-size:11px}
.bal-svg .gr{stroke:var(--linha2);stroke-width:1}
.bal-svg .bs{fill:var(--pino)}.bal-svg .be{fill:var(--suave);fill-opacity:.45}
.bal-svg rect[data-tip]:hover{filter:brightness(1.15)}
.bal-rank{display:grid;gap:8px}
.bal-lin{display:grid;grid-template-columns:minmax(90px,200px) 1fr auto;gap:12px;align-items:center;font-size:15px}
.bal-lin .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal-med{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}.bal-med .modo{margin:0}.bal-med .modo button{padding:0 14px;font-size:14px}
.bal-lin .tr{height:14px;background:var(--linha2);border-radius:7px;overflow:hidden}
.bal-lin .tr i{display:block;height:100%;background:var(--pino);border-radius:0 7px 7px 0;min-width:3px}
.bal-lin.fr .tr i{background:var(--suave);opacity:.55}
.bal-lin .vl{font-weight:700;white-space:nowrap}
.bal-lin .vl small{font-weight:500;color:var(--suave)}
.bal-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--alerta);background:var(--alerta-bg);border-radius:8px;padding:2px 8px}
.bal-vazio{text-align:center;color:var(--suave);padding:34px 10px}
.bal-nota{color:var(--suave);font-size:13px;margin:4px 2px 24px}
#balTip{position:fixed;z-index:9999;pointer-events:none;background:var(--tinta);color:var(--painel);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.35;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:240px;display:none}
.bal-tab{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.bal-tab th,.bal-tab td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--linha2)}
.bal-tab th:first-child,.bal-tab td:first-child{text-align:left}
#vBal details summary{cursor:pointer;font-weight:600;color:var(--suave);padding:4px 0}
@media (max-width:640px){.bal-tiles{grid-template-columns:repeat(2,1fr)}.bal-lin{grid-template-columns:minmax(70px,120px) 1fr auto;gap:8px;font-size:14px}.bal-nav b{min-width:120px}}

.plPar{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin:6px 0}.plPar label{margin:0}.plPar select{margin:0}
.cbl{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.dlg .cbl input{margin-top:0;flex:1;min-width:0;font-size:16px}
.tile[disabled]{opacity:.55;cursor:not-allowed}
dialog:has(.larga){width:min(94vw,720px)}
.rvLista{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:14px 0 6px;padding-right:2px}
.rv{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--linha);border-radius:14px;padding:10px}
.dlg .rv .rvOn{width:22px;height:22px;min-height:0;margin:11px 0 0;flex:none}
.rvC{flex:1;display:grid;gap:8px;min-width:0}
.dlg .rvC input,.rvC select{min-height:42px;border:1.5px solid var(--linha);border-radius:10px;padding:0 10px;font:inherit;background:var(--painel);color:inherit;width:100%;margin:0}
.rvQ{display:grid;grid-template-columns:110px 80px 1fr;gap:8px;align-items:center}
.dlg .rvQ .rvF{display:flex;align-items:center;gap:6px;font-weight:500;margin:0;font-size:13.5px}
.dlg .rvF input{width:18px;height:18px;min-height:0;margin:0}
.rvF[hidden]{display:none!important}

/* ---------- topo ---------- */
.topo{background:var(--topo);color:#fff;border-bottom:3px solid var(--azul)}
.topo .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topo .cima{padding-top:20px}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:54px;height:54px;border-radius:15px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.25);display:block;overflow:hidden}
html[data-cantos] .logo{border-radius:15px}
.logo svg{width:100%;height:100%;display:block}
.logo .pt{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:ptw 3.2s ease-in-out infinite}
.logo .p2{animation-delay:.5s}.logo .p3{animation-delay:1s}.logo .p4{animation-delay:1.5s}.logo .p5{animation-delay:2s}.logo .p6{animation-delay:2.5s}
@keyframes ptw{0%,70%,100%{opacity:0;transform:scale(.4)}35%{opacity:.95;transform:scale(1.6)}}
.logo .cb{transform-box:fill-box}
.marca:hover .logo{transform:translateY(-2px);transition:transform .25s}
/* ---------- abertura (BC Vertex) ---------- */
#abertura{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;overflow:hidden;z-index:9999;display:grid;place-items:center;background:#fff;color:#4C1D95;transition:opacity .5s,visibility .5s;cursor:pointer}
:root[style*="color-scheme: dark"] #abertura{background:#14101f;color:#C4B5FD}
#abertura:not(:popover-open){display:none}
#abertura:popover-open{display:grid}
#abertura.sai{opacity:0;visibility:hidden;pointer-events:none}
#abertura .cx{display:grid;justify-items:center;gap:22px}
#abertura svg.lg{width:min(46vw,200px);height:auto;overflow:visible}
#abertura .lq{transform-origin:100px 100px;animation:abPop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes abPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#abertura .fl{animation:abBob 2s ease-in-out infinite}
@keyframes abBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#abertura .ln{fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:abDraw 1s .45s ease forwards}
@keyframes abDraw{to{stroke-dashoffset:0}}
#abertura .fc{fill:#fff;opacity:0;animation:abFc .5s 1.2s ease forwards}
#abertura .f2{animation-delay:1.3s}#abertura .f3{animation-delay:1.4s}
@keyframes abFc{to{opacity:var(--o)}}
#abertura .dt{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:abDt 1.8s 1.6s ease-in-out infinite}
#abertura .d2{animation-delay:1.8s}#abertura .d3{animation-delay:2s}#abertura .d4{animation-delay:2.2s}#abertura .d5{animation-delay:2.4s}#abertura .d6{animation-delay:2.6s}
@keyframes abDt{0%,100%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.6)}}
#abertura .nm{font-size:clamp(30px,8vw,42px);font-weight:800;letter-spacing:.01em;margin:0;opacity:0;animation:abUp .7s 1s ease forwards}
#abertura .tr{width:46px;height:4px;border-radius:2px;background:#8B5CF6;opacity:0;animation:abUp .7s 1.3s ease forwards}
#abertura .sb{font-size:14px;opacity:0;margin:-8px 0 0;animation:abUp .7s 1.5s ease forwards;color:inherit}
@keyframes abUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#abertura{display:none}.logo .pt{animation:none}}
.titulo{font-size:22px;font-weight:750;margin:0;letter-spacing:-.015em;line-height:1.15}
.data{margin:2px 0 0;font-size:13.5px;color:rgba(255,255,255,.66)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 0 12px}.qrbox .qr{border-radius:10px;border:1px solid var(--line,#ddd);max-width:100%;height:auto}.qrbox small{color:var(--muted,#6b7280);text-align:center}
.codigo{font-size:36px;font-weight:800;letter-spacing:.2em;text-align:center;margin:4px 0 16px;font-variant-numeric:tabular-nums}
.chk{display:flex!important;align-items:center;gap:10px;margin:12px 0!important;font-weight:600;cursor:pointer}
.chk input{width:auto!important;margin:0!important}
.sychip{display:none;align-items:center;gap:7px;margin:3px 0 0;padding:0;border:0;background:none;color:rgba(255,255,255,.8);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.sychip.on{display:inline-flex}
.sychip i{flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22)}
.sychip.aviso i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.sychip.err i{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
html[data-topo="claro"] .sychip{color:var(--suave)}
.topo .acoes{margin-left:auto;display:flex;gap:8px}
.topo .acoes .btn{white-space:nowrap}
.seg{position:relative;display:inline-flex;background:rgba(255,255,255,.1);border-radius:13px;padding:4px;margin:18px 0 20px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;background:#fff;border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.22);transition:transform .38s var(--ease),width .38s var(--ease)}
.seg button{position:relative;z-index:1;background:none;border:0;padding:9px 22px;border-radius:10px;
  color:rgba(255,255,255,.78);font-weight:700;cursor:pointer;transition:color .25s}
.seg button[aria-selected="true"]{color:var(--topo)}

.aviso-backup{background:var(--alerta-bg);color:var(--alerta);font-size:14px;border-bottom:1px solid rgba(0,0,0,.05)}
.aviso-backup .wrap{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.aviso-backup button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.aviso-erro{background:var(--perigo-bg);color:var(--perigo)}

/* ---------- botões ---------- */
.btn{border:1px solid var(--linha);background:var(--painel);border-radius:12px;padding:0 16px;min-height:44px;
  font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background-color .18s,border-color .18s,transform .12s,box-shadow .18s}
.btn:hover{background:var(--linha2)}
.btn:active{transform:scale(.97)}
.btn.prim{background:var(--pino);border-color:var(--pino);color:#fff}
.btn.prim:hover{background:var(--pino-h);border-color:var(--pino-h)}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.17)}
.btn.claro{background:#fff;border-color:#fff;color:var(--topo)}
.btn.claro:hover{background:#E3F3FC}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.perigo{color:var(--perigo);border-color:color-mix(in srgb,var(--perigo) 40%,transparent)}
.btn.perigo.armado{background:var(--perigo);border-color:var(--perigo);color:#fff}
.btn.peq{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.quad{width:44px;padding:0}
.icone{width:48px;min-height:48px;border:1px solid var(--linha);background:var(--painel);border-radius:12px;
  display:grid;place-items:center;cursor:pointer;transition:background-color .18s,transform .12s}
.icone:hover{background:var(--linha2)}
.icone:active{transform:scale(.94)}

/* ---------- filtros e busca ---------- */
main.wrap{padding-top:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{display:flex;align-items:center;gap:12px;text-align:left;background:var(--painel);border:1.5px solid var(--linha);
  border-radius:16px;padding:12px 14px;cursor:pointer;transition:border-color .2s,box-shadow .25s,transform .12s}
.stat:hover{border-color:color-mix(in srgb,var(--pino) 45%,var(--linha))}
.stat:active{transform:scale(.985)}
.stat[aria-pressed="true"]{border-color:var(--pino);box-shadow:0 0 0 4px var(--anel)}
.stat .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat[data-f="todos"] .ic{background:var(--azul-bg);color:var(--azul-tx)}
.stat[data-f="repor"] .ic{background:var(--alerta-bg);color:var(--alerta)}
.stat[data-f="sem"] .ic{background:var(--perigo-bg);color:var(--perigo)}
.stat b{display:block;font-size:26px;line-height:1;font-weight:750;letter-spacing:-.02em}
.stat small{display:block;color:var(--suave);font-size:13px;font-weight:600;margin-top:3px}

.ferr{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 0 14px}
.campo-busca{position:relative;flex:1 1 240px}
.campo-busca .i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--suave);pointer-events:none}
.busca{width:100%;min-height:48px;border:1.5px solid var(--linha);border-radius:14px;padding:0 14px 0 44px;background:var(--painel);
  transition:border-color .2s,box-shadow .25s}
.busca:focus{outline:none;border-color:var(--pino);box-shadow:0 0 0 4px var(--anel)}
.busca::placeholder{color:#8A9A93}
select.busca{padding-left:14px;width:auto;flex:0 0 auto}

/* ---------- lista de produtos ---------- */
.lista{display:flex;flex-direction:column;gap:10px;padding-bottom:48px}
.linha{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px 18px;align-items:center;
  background:var(--painel);border:1px solid var(--linha);border-radius:18px;padding:14px 16px;
  transition:box-shadow .25s,border-color .25s}
.linha:hover{border-color:color-mix(in srgb,var(--pino) 30%,var(--linha));box-shadow:0 10px 24px -14px rgba(32,58,82,.45)}
.avatar{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:21px;transition:background-color .4s,color .4s}
.avatar.ok{background:var(--ok-bg);color:var(--ok)}
.avatar.repor{background:var(--alerta-bg);color:var(--alerta)}
.avatar.sem{background:var(--perigo-bg);color:var(--perigo)}
.nm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nome{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.selo{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;transition:background-color .4s,color .4s}
.selo.ok{background:var(--ok-bg);color:var(--ok)}
.selo.repor{background:var(--alerta-bg);color:var(--alerta)}
.selo.sem{background:var(--perigo-bg);color:var(--perigo)}
.nivel{position:relative;height:8px;border-radius:4px;background:var(--trilho);margin-top:11px;max-width:380px}
.nivel i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .8s var(--ease),background-color .4s}
.nivel b{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--tinta);opacity:.45}
.min{color:var(--suave);font-size:13px;margin-top:7px}
.saldo{text-align:right;min-width:92px}
.saldo .num{font-size:30px;font-weight:750;letter-spacing:-.025em;line-height:1}
.saldo .un{color:var(--suave);font-size:14px;margin-left:5px}
.linha .botoes{display:flex;gap:8px}
.linha.pulso{animation:pulso 1.3s ease-out}
@keyframes pulso{0%,25%{background:var(--pulso)}100%{background:var(--painel)}}
.linha.anim{animation:entra .42s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.vazio{background:var(--painel);border:1.5px dashed color-mix(in srgb,var(--pino) 35%,var(--linha));border-radius:20px;padding:44px 20px;text-align:center}
.vazio .ilus{width:84px;height:84px;border-radius:24px;background:var(--azul-bg);color:var(--azul-tx);display:grid;place-items:center;margin:0 auto 16px}
.vazio .ilus .i{width:38px;height:38px;stroke-width:1.6}
.vazio h2{margin:0 0 6px;font-size:19px}
.vazio p{margin:0 auto 18px;color:var(--suave);max-width:380px}

/* ---------- histórico ---------- */
.dia{font-size:13.5px;font-weight:700;color:var(--suave);margin:20px 4px 8px}
.dia:first-child{margin-top:4px}
.movs{background:var(--painel);border:1px solid var(--linha);border-radius:18px;overflow:hidden}
.mov{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:12px 16px;
  border-bottom:1px solid var(--linha2);transition:background-color .2s}
.mov:last-child{border-bottom:0}
.mov:hover{background:var(--fundo)}
.bolha{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.bolha.ent{background:var(--ok-bg);color:var(--ok)}
.bolha.sai{background:var(--perigo-bg);color:var(--perigo)}
.mi b{display:block;overflow-wrap:anywhere}
.mi small{color:var(--suave);font-size:13px;overflow-wrap:anywhere}
.mq{text-align:right;line-height:1.25}
.mq b{font-size:16px}
.mq.ent b{color:var(--ok)} .mq.sai b{color:var(--perigo)}
.mq small{display:block;color:var(--suave);font-size:12.5px}
.rodape-hist{color:var(--suave);font-size:13px;margin:12px 4px 48px}
#hist{padding-bottom:48px}

<script>
"use strict";
const CHAVE = "controle-estoque-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON = n => '<svg class="i" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const nf = new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 3});
const fmt = n => nf.format(n);
const arred = n => Math.round(n * 1000) / 1000;
function num(t){ const s = String(t).trim().replace(",", "."); return s === "" ? NaN : Number(s); }
const reais = v => Number(v || 0).toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const reaisC = v => Number(v || 0).toLocaleString("pt-BR", {style: "currency", currency: "BRL", maximumFractionDigits: 0});
function dinheiro(t){ let x = String(t == null ? "" : t).replace(/R\$|\s/g, ""); if(x === "") return NaN; if(x.includes(",")) x = x.replace(/\./g, "").replace(",", "."); return Number(x); }
const cent = v => Math.round(v * 100) / 100;
const hora = ts => new Date(ts).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
const reduzido = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- dados ---------- */
let salvoOk = true;
function carregar(){
  try{
    const t = localStorage.getItem(CHAVE);
    if(t){
      const d = JSON.parse(t);
      if(d && Array.isArray(d.produtos) && Array.isArray(d.movs)) return d;
    }
  }catch(e){ salvoOk = false; }
  return {produtos: [], movs: [], seq: 1, backupEm: null};
}
let db = carregar();
function salvar(){
  try{ localStorage.setItem(CHAVE, JSON.stringify(db)); salvoOk = true; }
  catch(e){ salvoOk = false; }
  if(typeof agendarSync === "function") agendarSync();
}
const proxId = () => db.seq++;
const prod = id => db.produtos.find(p => p.id === id);

function saldos(){
  const m = new Map();
  for(const v of db.movs){
    m.set(v.pid, arred((m.get(v.pid) || 0) + (v.tipo === "ENTRADA" ? v.qtd : -v.qtd)));
  }
  return m;
}
const saldoDe = id => saldos().get(id) || 0;
const status = (s, min) => s <= 0 ? "sem" : (s <= min ? "repor" : "ok");
const ROTULO = {ok: "OK", repor: "Repor", sem: "Sem estoque"};
const COR = {ok: "var(--b-ok)", repor: "var(--b-repor)", sem: "var(--b-sem)"};
const pctDe = (s, min) => Math.max(0, Math.min(100, s / Math.max(min * 2, s, 1) * 100));

function registrar(pid, tipo, qtd, obs, fardos, preco){
  const id = proxId(), pr = prod(pid);
  const mv = {id, ts: new Date().toISOString(), pid, tipo, qtd, obs: obs || ""};
  if(fardos > 0) mv.fardos = fardos;
  if(preco === undefined && pr) preco = tipo === "SAIDA" ? pr.preco : pr.custo;
  if(preco > 0) mv.preco = cent(preco);
  if(tipo === "SAIDA" && pr && pr.custo > 0) mv.custo = cent(pr.custo);
  db.movs.push(mv);
  salvar();
  return id;
}
function textoFardos(p, s){
  if(!(p.fardo > 0)) return "";
  const f = Math.floor(arred(s / p.fardo)), r = arred(s - f * p.fardo);
  return f + (f === 1 ? " fardo" : " fardos") + (r > 0 ? " + " + fmt(r) + " " + p.unidade : "");
}
const txtFardos = n => fmt(n) + (n === 1 ? " fardo" : " fardos");

/* ---------- estado da tela ---------- */
let aba = "estoque", filtro = "todos", primeira = true;
let prevSal = new Map();

function render(modo){
  renderFaixa();
  if(aba === "estoque") renderEstoque(modo); else if(aba === "bal") renderBalanco(); else renderHist();
}

function renderFaixa(){
  let html = htmlLicenca();
  if(!salvoOk){
    html += '<div class="aviso-backup aviso-erro"><div class="wrap">Este navegador não está deixando salvar os dados. Não use a aba anônima e faça backup com frequência.</div></div>';
  } else if(db.movs.length){
    const dias = db.backupEm ? Math.floor((Date.now() - new Date(db.backupEm)) / 864e5) : null;
    if(dias === null || dias >= 7){
      const txt = dias === null ? "Você ainda não fez backup." : "Último backup há " + dias + " dias.";
      html += '<div class="aviso-backup"><div class="wrap"><span>Os dados ficam salvos só neste computador. ' + txt + '</span><button id="bAvisoBackup">Fazer backup agora</button></div></div>';
    }
  }
  $("#faixa").innerHTML = html;
  const b = $("#bAvisoBackup"); if(b) b.onclick = dialogoBackup;
  const bl = $("#bAvisoLic"); if(bl) bl.onclick = dialogoLicenca;
}

function animaNumero(el, de, para){
  if(reduzido()){ el.textContent = fmt(para); return; }
  const inteiro = Number.isInteger(de) && Number.isInteger(para), t0 = performance.now(), dur = 650;
  const passo = agora => {
    const k = Math.min(1, (agora - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    const v = de + (para - de) * e;
    el.textContent = fmt(k === 1 ? para : (inteiro ? Math.round(v) : arred(v)));
    if(k < 1) requestAnimationFrame(passo);
  };
  el.textContent = fmt(de);
  requestAnimationFrame(passo);
}

function renderEstoque(modo){
  const sal = saldos();
  const itens = db.produtos
    .map(p => { const s = sal.get(p.id) || 0; return {p, s, st: status(s, p.minimo)}; })
    .sort((a, b) => a.p.nome.localeCompare(b.p.nome, "pt-BR"));

  $("#nTodos").textContent = itens.length;
  $("#nRepor").textContent = itens.filter(x => x.st !== "ok").length;
  $("#nSem").textContent = itens.filter(x => x.st === "sem").length;
  document.querySelectorAll(".stat").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filtro)));

  const q = $("#busca").value.trim().toLowerCase();
  const vis = itens.filter(x =>
    (!q || x.p.nome.toLowerCase().includes(q)) &&
    (filtro === "todos" || (filtro === "repor" && x.st !== "ok") || (filtro === "sem" && x.st === "sem")));

  const el = $("#lista");
  if(!itens.length){
    el.innerHTML = '<div class="vazio"><div class="ilus">' + ICON("box") + '</div><h2>Seu estoque está vazio</h2><p>Cadastre o primeiro produto para começar a registrar entradas e baixas.</p><button class="btn prim" data-a="novo">' + ICON("plus") + 'Cadastrar produto</button></div>';
    prevSal = new Map(); return;
  }
  if(!vis.length){
    el.innerHTML = '<div class="vazio"><div class="ilus">' + ICON("search") + '</div><h2>Nada encontrado</h2><p>Nenhum produto corresponde à busca ou ao filtro escolhido.</p></div>';
    prevSal = new Map(sal); return;
  }
  const anim = modo === "inicial" || modo === "filtro";
  el.innerHTML = vis.map(({p, s, st}, n) => {
    const pct = pctDe(s, p.minimo);
    const tick = p.minimo > 0 ? '<b style="left:' + (p.minimo / Math.max(p.minimo * 2, s, 1) * 100) + '%" title="Mínimo: ' + fmt(p.minimo) + '"></b>' : "";
    const letra = esc(Array.from(p.nome.trim())[0] || "?").toUpperCase();
    return '<article class="linha' + (anim ? " anim" : "") + '" style="--i:' + Math.min(n, 10) + '" data-id="' + p.id + '" data-s="' + s + '" data-min="' + p.minimo + '">' +
      '<div class="avatar ' + st + '" aria-hidden="true">' + letra + '</div>' +
      '<div><div class="nm"><span class="nome">' + esc(p.nome) + '</span><span class="selo ' + st + '">' + ROTULO[st] + '</span></div>' +
      '<div class="nivel"><i style="width:' + pct + '%;background:' + COR[st] + '"></i>' + tick + '</div>' +
      '<div class="min">Mínimo: ' + fmt(p.minimo) + ' ' + esc(p.unidade) + (p.preco > 0 ? ' · ' + reais(p.preco) + '/' + esc(p.unidade) : '') + '</div></div>' +
      '<div class="saldo"><span class="num">' + fmt(s) + '</span><span class="un">' + esc(p.unidade) + '</span>' +
        (p.fardo > 0 ? '<div class="fd">' + esc(textoFardos(p, s)) + '</div>' : "") + '</div>' +
      '<div class="botoes">' +
        '<button class="btn prim" data-a="saida" data-id="' + p.id + '">' + ICON("minus") + 'Dar baixa</button>' +
        '<button class="btn ent" data-a="entrada" data-id="' + p.id + '">' + ICON("plus") + 'Entrada</button>' +
        '<button class="btn quad" data-a="editar" data-id="' + p.id + '" aria-label="Editar ' + esc(p.nome) + '" title="Editar">' + ICON("pencil") + '</button>' +
      '</div></article>';
  }).join("");

  /* animações: barra que cresce, número que conta, linha que pulsa */
  el.querySelectorAll(".linha").forEach(li => {
    const id = Number(li.dataset.id), s = Number(li.dataset.s), min = Number(li.dataset.min);
    const prev = prevSal.get(id), barra = li.querySelector(".nivel i"), fim = pctDe(s, min);
    let ini = fim;
    if(prev !== undefined && prev !== s){
      ini = pctDe(prev, min);
      animaNumero(li.querySelector(".num"), prev, s);
      li.classList.add("pulso");
    } else if(modo === "inicial"){ ini = 0; }
    if(ini !== fim && !reduzido()){
      barra.style.width = ini + "%";
      requestAnimationFrame(() => requestAnimationFrame(() => { barra.style.width = fim + "%"; }));
    }
  });
  prevSal = new Map(sal);
}

function rotuloDia(ts){
  const d = new Date(ts), h = new Date();
  const ini = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const dif = Math.round((ini(h) - ini(d)) / 864e5);
  if(dif === 0) return "Hoje";
  if(dif === 1) return "Ontem";
  return d.toLocaleDateString("pt-BR", {weekday: "long", day: "numeric", month: "long"}).replace(/^./, c => c.toUpperCase());
}

function renderHist(){
  const q = $("#buscaH").value.trim().toLowerCase(), tipo = $("#tipoH").value;
  const todos = db.movs.slice().reverse().filter(v => {
    const p = prod(v.pid);
    return p && (!q || p.nome.toLowerCase().includes(q)) && (!tipo || v.tipo === tipo);
  });
  const el = $("#hist");
  if(!todos.length){
    el.innerHTML = '<div class="vazio"><div class="ilus">' + ICON("file") + '</div><h2>Nenhuma movimentação</h2><p>As entradas e baixas registradas aparecem aqui, separadas por dia.</p></div>';
    return;
  }
  const LIM = 300, lista = todos.slice(0, LIM);
  let html = "", dia = null;
  lista.forEach(v => {
    const r = rotuloDia(v.ts), p = prod(v.pid), ent = v.tipo === "ENTRADA";
    if(r !== dia){
      if(dia !== null) html += "</div>";
      html += '<div class="dia">' + esc(r) + '</div><div class="movs">'; dia = r;
    }
    html += '<div class="mov"><span class="bolha ' + (ent ? "ent" : "sai") + '">' + ICON(ent ? "down" : "up") + '</span>' +
      '<div class="mi"><b>' + esc(p.nome) + '</b><small>' + (v.fardos ? '<span class="tag">' + esc(txtFardos(v.fardos)) + '</span>' : "") + (v.obs ? esc(v.obs) : (ent ? "Entrada" : "Saída")) + '</small></div>' +
      '<div class="mq ' + (ent ? "ent" : "sai") + '"><b>' + (ent ? "+" : "−") + fmt(v.qtd) + " " + esc(p.unidade) + '</b><small>' + hora(v.ts) + (v.preco > 0 ? ' · ' + reais(v.preco * v.qtd) : '') + '</small></div>' +
      '<button class="btn peq" data-a="desfazer" data-id="' + v.id + '" title="Desfazer" aria-label="Desfazer movimentação">' + ICON("undo") + '<span class="lbl">Desfazer</span></button></div>';
  });
  html += "</div>" + (todos.length > LIM ? '<p class="rodape-hist">Mostrando as ' + LIM + ' movimentações mais recentes de ' + todos.length + '. Use o filtro ou exporte o histórico completo em Backup.</p>' : "");
  el.innerHTML = html;
}

/* ---------- aviso flutuante ---------- */
let toastTimer;
function toast(msg, tipo, desfazerId){
  const t = $("#toast"), dur = desfazerId ? 9 : 5;
  t.className = "";
  void t.offsetWidth;
  t.className = "v " + (tipo || "");
  t.style.setProperty("--dur", dur + "s");
  t.innerHTML = "<span>" + esc(msg) + "</span>" + (desfazerId ? '<button id="tDesf">Desfazer</button>' : "") + '<i class="tempo"></i>';
  if(desfazerId) $("#tDesf").onclick = () => { t.className = ""; if(typeof desfazerId === "function") desfazerId(); else desfazerMov(desfazerId); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, dur * 1000);
}

function desfazerMov(id){
  if(!podeEditar()){ dialogoLicenca(); return; }
  const v = db.movs.find(m => m.id === id);
  if(!v) return;
  if(v.tipo === "ENTRADA" && saldoDe(v.pid) - v.qtd < 0){
    toast("Não dá para desfazer: o estoque desse produto ficaria negativo.", "erro");
    return;
  }
  db.movs = db.movs.filter(m => m.id !== id);
  salvar(); render();
  toast("Movimentação desfeita.");
}

/* ---------- diálogos ---------- */
const dlg = $("#dlg");
let fechando;
function abrir(html){
  clearTimeout(fechando); dlg.classList.remove("saindo");
  dlg.innerHTML = '<div class="dlg">' + html + "</div>";
  if(!dlg.open) dlg.showModal();
}
function fechar(){
  if(!dlg.open) return;
  if(reduzido()){ dlg.close(); return; }
  dlg.classList.add("saindo");
  fechando = setTimeout(() => { dlg.close(); dlg.classList.remove("saindo"); }, 150);
}
dlg.addEventListener("click", e => {
  if(e.target === dlg) fechar();
  if(e.target.closest("[data-fechar]")) fechar();
});

const modoPref = {};
function dialogoMov(pid, tipo){
  if(!podeEditar()){ dialogoLicenca(); return; }
  const p = prod(pid), s = saldoDe(pid), baixa = tipo === "SAIDA", temF = p.fardo > 0, un = p.unidade;
  let modoF = temF && modoPref[pid] === "F";
  abrir('<form id="f" novalidate>' +
    '<div class="dh"><span class="dic ' + (baixa ? "sai" : "ent") + '">' + ICON(baixa ? "minus" : "plus") + '</span>' +
    '<div><h2>' + (baixa ? "Dar baixa" : "Registrar entrada") + '</h2>' +
    '<p class="sub"><b>' + esc(p.nome) + '</b><br>Em estoque: ' + fmt(s) + ' ' + esc(un) + (temF ? ' (' + esc(textoFardos(p, s)) + ')' : "") + '</p></div></div>' +
    (temF ? '<div class="modo" role="group" aria-label="Contar em"><button type="button" data-modo="U">Unidades</button><button type="button" data-modo="F">Fardos <small>(' + fmt(p.fardo) + ' ' + esc(un) + ' cada)</small></button></div>' : "") +
    '<label for="q" id="qrot">Quantidade</label>' +
    '<div class="qtd"><button type="button" class="icone" data-step="-1" aria-label="Diminuir">' + ICON("minus") + '</button>' +
    '<input id="q" inputmode="decimal" autocomplete="off" value="1">' +
    '<button type="button" class="icone" data-step="1" aria-label="Aumentar">' + ICON("plus") + '</button></div>' +
    '<div class="rapidos" id="rap"></div>' +
    '<p class="prev" id="prev"></p>' +
    '<label for="vu">Valor por ' + esc(un) + ' (R$) <span class="opc">(opcional)</span></label>' +
    '<input id="vu" inputmode="decimal" autocomplete="off" placeholder="Ex.: 12,50" value="' + ((baixa ? p.preco : p.custo) > 0 ? String(baixa ? p.preco : p.custo).replace(".", ",") : "") + '">' +
    '<label for="o">Observação <span class="opc">(opcional)</span></label>' +
    '<input id="o" maxlength="80" autocomplete="off" placeholder="' + (baixa ? "Ex.: venda no balcão" : "Ex.: compra do fornecedor") + '">' +
    '<p class="erro" id="e" role="alert"></p>' +
    '<div class="botoes"><button type="button" class="btn" data-fechar>Cancelar</button>' +
    '<button class="btn prim">' + (baixa ? "Confirmar baixa" : "Confirmar entrada") + '</button></div></form>');

  const q = $("#q"), prev = $("#prev"), err = $("#e"), rap = $("#rap");
  const unidades = () => { const n = num(q.value); return isNaN(n) ? NaN : (modoF ? arred(n * p.fardo) : n); };
  const atualizar = () => {
    const n = unidades();
    if(isNaN(n) || n <= 0){ prev.textContent = ""; prev.className = "prev"; return; }
    const novo = arred(baixa ? s - n : s + n);
    const vu0 = dinheiro($("#vu").value);
    prev.textContent = (modoF ? txtFardos(num(q.value)) + " = " + fmt(n) + " " + un + ". " : "") +
      "Vai ficar com " + fmt(novo) + " " + un + (temF && novo >= 0 ? " (" + textoFardos(p, novo) + ")" : "") + (vu0 > 0 ? ". Total: " + reais(vu0 * n) : "");
    prev.className = "prev" + (novo < 0 ? " neg" : "");
  };
  const chips = () => {
    const lista = modoF ? [1, 2, 3, 5] : [1, 5, 10, 20];
    let html = lista.map(n => '<button type="button" class="chip" data-q="' + n + '">' + n + '</button>').join("");
    if(baixa){
      if(modoF){ const t = Math.floor(arred(s / p.fardo)); if(t > 0) html += '<button type="button" class="chip" data-q="' + t + '">Todos (' + t + ')</button>'; }
      else if(s > 0) html += '<button type="button" class="chip" data-q="' + s + '">Tudo (' + fmt(s) + ')</button>';
    }
    rap.innerHTML = html;
  };
  const definirModo = f => {
    modoF = f; modoPref[pid] = f ? "F" : "U";
    dlg.querySelectorAll("[data-modo]").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.modo === "F") === modoF)));
    $("#qrot").textContent = temF ? (modoF ? "Quantidade de fardos" : "Quantidade em unidades") : "Quantidade";
    err.textContent = ""; chips(); atualizar();
  };
  dlg.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { definirModo(b.dataset.modo === "F"); q.focus(); q.select(); });
  q.addEventListener("input", () => { err.textContent = ""; atualizar(); });
  $("#vu").addEventListener("input", () => { err.textContent = ""; atualizar(); });
  dlg.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    const n = num(q.value), base = isNaN(n) ? 0 : n;
    q.value = String(Math.max(0, arred(base + Number(b.dataset.step)))).replace(".", ",");
    q.dispatchEvent(new Event("input"));
  });
  rap.onclick = e => {
    const b = e.target.closest("[data-q]"); if(!b) return;
    q.value = String(b.dataset.q).replace(".", ","); q.dispatchEvent(new Event("input")); q.focus();
  };
  $("#f").onsubmit = e => {
    e.preventDefault();
    const n = num(q.value), u = unidades();
    if(isNaN(n) || n <= 0){ err.textContent = "Digite uma quantidade maior que zero."; q.focus(); return; }
    if(baixa && u > s){
      err.textContent = "Estoque insuficiente. Disponível: " + fmt(s) + " " + un + (temF ? " (" + textoFardos(p, s) + ")" : "") + ".";
      q.focus(); return;
    }
    const vuTxt = $("#vu").value.trim(), vu = vuTxt === "" ? 0 : dinheiro(vuTxt);
    if(vuTxt !== "" && (isNaN(vu) || vu < 0)){ err.textContent = "O valor deve ser um número, ex.: 12,50."; $("#vu").focus(); return; }
    const id = registrar(pid, tipo, u, $("#o").value.trim(), modoF ? arred(n) : 0, vu > 0 ? vu : 0);
    const novo = arred(baixa ? s - u : s + u);
    fechar(); render();
    const qtdTxt = modoF ? txtFardos(n) + " (" + fmt(u) + " " + un + ")" : fmt(n) + " " + un;
    let msg = (baixa ? "Baixa registrada: " : "Entrada registrada: ") + qtdTxt + " de " + p.nome + ". Estoque: " + fmt(novo) + ".";
    let tp = "";
    if(baixa && novo <= 0){ msg += " Sem estoque!"; tp = "alerta"; }
    else if(baixa && novo <= p.minimo){ msg += " Abaixo do mínimo, hora de repor."; tp = "alerta"; }
    toast(msg, tp, id);
  };
  if(temF) definirModo(modoF); else { chips(); atualizar(); }
  q.focus(); q.select();
}

function dialogoProduto(id){
  if(!podeEditar()){ dialogoLicenca(); return; }
  const p = id ? prod(id) : null;
  const cpend = p ? "" : codigoPendente; codigoPendente = "";

  const abreMais = !!(cpend || (p && (p.codigo || p.minimo > 0 || outra || p.custo > 0)));
  abrir('<form id="f" novalidate>' +
    '<div class="dh"><span class="dic neu">' + ICON(p ? "pencil" : "box") + '</span><div><h2>' + (p ? "Editar produto" : "Novo produto") + '</h2>' +
    '<p class="sub">' + (p ? "Altere os dados do produto." : "Nome, como você conta e quanto tem.") + '</p></div></div>' +

    '<label>Como você conta esse produto?</label>' +
    '<div class="modo" role="group" id="mm"><button type="button" data-m="un" aria-pressed="' + (modo === "un") + '">Unidade</button><button type="button" data-m="kg" aria-pressed="' + (modo === "kg") + '">Quilo (kg)</button><button type="button" data-m="fardo" aria-pressed="' + (modo === "fardo") + '">Fardo</button></div>' +
    '<div id="fdBox"><label for="fd">Quantas unidades vêm em cada fardo?</label><input id="fd" inputmode="decimal" autocomplete="off" placeholder="Ex.: 12" value="' + (p && p.fardo > 0 ? fmt(p.fardo) : "") + '"></div>' +
    '<label for="pv" id="pvRot">Preço de venda por unidade (R$) <small class="dica">Opcional.</small></label><input id="pv" inputmode="decimal" autocomplete="off" placeholder="Ex.: 12,50" value="' + (p && p.preco > 0 ? String(p.preco).replace(".", ",") : "") + '">' +
    (p ? "" : '<label for="i" id="iRot">Quantas unidades você tem agora?</label><input id="i" inputmode="decimal" autocomplete="off" value="0">') +
    '<details id="mais"' + (abreMais ? " open" : "") + '><summary>Mais opções</summary>' +
    '<label for="u">Outra unidade <small class="dica">Opcional. Ex.: l, cx, pct. Se vazio, usa “un”.</small></label><input id="u" maxlength="10" list="unid" autocomplete="off" value="' + esc(outra) + '">' +
    '<datalist id="unid"><option value="cx"><option value="pç"><option value="g"><option value="l"><option value="ml"><option value="pct"><option value="par"></datalist>' +
    '<label for="m">Estoque mínimo <small class="dica" id="mDica">Abaixo dele, o produto aparece como "Repor".</small></label><input id="m" inputmode="decimal" autocomplete="off" value="' + (p ? fmt(p.minimo) : "0") + '">' +
    '<label for="pc" id="pcRot">Preço de custo por unidade (R$) <small class="dica">Opcional. Quanto você paga. Serve para calcular o lucro.</small></label><input id="pc" inputmode="decimal" autocomplete="off" placeholder="Ex.: 8,00" value="' + (p && p.custo > 0 ? String(p.custo).replace(".", ",") : "") + '">' +
    '<label for="cb">Código de barras <small class="dica">Permite achar o produto pela câmera.</small></label><input id="cb" inputmode="numeric" maxlength="20" autocomplete="off" value="' + esc(p ? (p.codigo || "") : cpend) + '"></details>' +
    '<p class="erro" id="e" role="alert"></p>' +
    '<div class="botoes">' + (p ? '<button type="button" class="btn perigo esq" id="bExc">Excluir produto</button>' : "") +
    '<button type="button" class="btn" data-fechar>Cancelar</button><button class="btn prim">' + (p ? "Salvar alterações" : "Cadastrar produto") + '</button></div></form>');

  const err = $("#e");
  const atualizaModo = () => {
    dlg.querySelectorAll("#mm [data-m]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === modo)));
    $("#fdBox").hidden = modo !== "fardo";
    if($("#iRot")) $("#iRot").textContent = modo === "fardo" ? "Quantos fardos você tem agora?" : modo === "kg" ? "Quantos quilos (kg) você tem agora?" : "Quantas unidades você tem agora?";

const temPasta = typeof window.showDirectoryPicker === "function";
function abrirIdb(){
  return new Promise((ok, erro) => {
    const r = indexedDB.open("controle-estoque-fs", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("h");
    r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
  });
}
async function idbGet(k){
  const d = await abrirIdb();
  return new Promise((ok, erro) => { const q = d.transaction("h").objectStore("h").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => erro(q.error); });
}
async function idbSet(k, v){
  const d = await abrirIdb();
  return new Promise((ok, erro) => { const t = d.transaction("h", "readwrite"); t.objectStore("h").put(v, k); t.oncomplete = () => ok(); t.onerror = () => erro(t.error); });
}
async function pastaBackup(escolher){
  let dir = null;
  if(!escolher){
    try{
      dir = await idbGet("pasta");
      if(dir){
        let perm = typeof dir.queryPermission === "function" ? await dir.queryPermission({mode: "readwrite"}) : "granted";
        if(perm !== "granted") perm = await dir.requestPermission({mode: "readwrite"});
        if(perm !== "granted") dir = null;
      }
    }catch(e){ dir = null; }
  }
  if(!dir){
    dir = await window.showDirectoryPicker({id: "estoque-backup", mode: "readwrite", startIn: "documents"});
    try{ await idbSet("pasta", dir); }catch(e){}
  }
  return dir;
}
async function gravar(dir, nome, conteudo){

const HR = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278, 556,556,556,556,556,556,556,556,556,556, 278,278,584,584,584,556,1015, 667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611, 278,278,278,469,556,333, 556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500, 334,260,334,584];
const HB = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278, 556,556,556,556,556,556,556,556,556,556, 333,333,584,584,584,611,975, 722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611, 333,278,333,584,556,333, 556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500, 389,280,389,584];
function larguraTxt(t, negrito, tam){
  const W = negrito ? HB : HR; let w = 0;
  for(const ch of String(t)){
    let c = ch.charCodeAt(0);
    if(c < 32 || c > 126){ const b = ch.normalize("NFD").charCodeAt(0); c = (b >= 32 && b <= 126) ? b : 63; }
    w += W[c - 32];
  }
  return w * tam / 1000;
}
function cortarTxt(t, negrito, tam, max){
  t = String(t);
  if(larguraTxt(t, negrito, tam) <= max) return t;
  while(t.length > 1 && larguraTxt(t + "...", negrito, tam) > max) t = t.slice(0, -1);
  return t.trimEnd() + "...";
}

    const ci = 5 + i * 2, pi = ci + 1, corpo = pg.join("\n");

    obj[pi] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + ci + " 0 R >>";
    kids.push(pi + " 0 R");

  out += "xref\n0 " + obj.length + "\n0000000000 65535 f \n" + pos.slice(1).map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") +

  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  let h = 0, s = 0;
  if(d){
    s = d / (1 - Math.abs(2 * l - 1));
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}

  let ico = document.querySelector('link[rel="icon"]');
  if(!ico){ ico = document.createElement("link"); ico.rel = "icon"; document.head.appendChild(ico); }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B21B6"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M52 22L32 11 12 22v20l20 11 20-11V22z"/><path d="M12 22l20 11 20-11M32 33v20"/></g></svg>';

/* ---------- licença ---------- */
const CHAVE_LIC = "controle-estoque-licenca", CHAVE_REV = "controle-estoque-lic-rev",
      CHAVE_VER = "controle-estoque-lic-ver", CHAVE_REL = "controle-estoque-lic-rel";
const CHAVE_PUB = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEl13IuILKlmpewRhQqquUbxITuSu/dovna0YmCUwy42DYkSAgGfFML9ITaYZjS2Vxs+83avJvLjihLOjHwP6bSA==";
const DIAS_SEM_VERIFICAR = 30;
let lic = undefined, licProblema = null, licEst = {estado: "carregando"}, dataBase = "";
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
const b64Bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64uBytes = s => b64Bytes(s.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - s.length % 4) % 4));
const fimDoDia = iso => { const [a, m, d] = iso.split("-").map(Number); return new Date(a, m - 1, d, 23, 59, 59, 999).getTime(); };
const fmtData = iso => iso ? iso.split("-").reverse().join("/") : "";
function agoraLic(){
  let a = Date.now();
  const r = Number(lsGet(CHAVE_REL) || 0);
  if(r > a) a = r; else lsSet(CHAVE_REL, String(a));
  return a;
}
async function verificarChave(texto){
  const chave = String(texto || "").replace(/\s+/g, "");
  const m = /^CE1-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(chave);
  if(!m) return {ok: false, erro: "Chave em formato inválido. Copie a chave inteira, sem alterar."};
  try{
    let ok;
    if(window.crypto && crypto.subtle && !window.__semSubtle){
      const pub = await crypto.subtle.importKey("spki", b64Bytes(CHAVE_PUB), {name: "ECDSA", namedCurve: "P-256"}, false, ["verify"]);
      ok = await crypto.subtle.verify({name: "ECDSA", hash: "SHA-256"}, pub, b64uBytes(m[2]), new TextEncoder().encode(m[1]));
    }else ok = ecdsaVerifyJs(b64Bytes(CHAVE_PUB), new TextEncoder().encode(m[1]), b64uBytes(m[2]));
    if(!ok) return {ok: false, erro: "Chave inválida. Confira se copiou a chave inteira."};
    const dados = JSON.parse(new TextDecoder().decode(b64uBytes(m[1])));
    if(!dados || dados.v !== 1 || !dados.id || !dados.empresa) return {ok: false, erro: "Chave inválida."};
    return {ok: true, dados, chave};
  }catch(e){ return {ok: false, erro: "Não foi possível verificar a chave."}; }
}
function calcLic(){
  if(licProblema) return {estado: licProblema};
  if(lic === undefined) return {estado: "carregando"};
  if(lic === null) return {estado: "sem"};
  if(lsGet(CHAVE_REV) === lic.id) return {estado: "revogada"};
  const agora = agoraLic();
  let dias = null;
  if(lic.validade){
    const fim = fimDoDia(lic.validade);
    if(agora > fim) return {estado: "expirada"};
    dias = Math.ceil((fim - agora) / 864e5);
  }
  if(lic.url){
    const ult = Number(lsGet(CHAVE_VER) || 0);
    if(agora - ult > DIAS_SEM_VERIFICAR * 864e5) return {estado: "verificar"};
  }
  return {estado: "ok", dias};
}
const podeEditar = () => licEst.estado === "ok";
function aplicarLicenca(){
  licEst = calcLic();
  document.documentElement.dataset.lic = licEst.estado === "ok" ? "ok" : "bloq";
  $("#dataHoje").textContent = dataBase + (lic ? " · " + lic.empresa : "");
  const r = $("#rodapeLic");
  if(lic){
    r.innerHTML = "Licença: <b>" + esc(lic.empresa) + "</b> · " + (lic.validade ? "válida até " + fmtData(lic.validade) : "sem data de validade") + ' · <button class="lnk" id="bLic">Gerenciar</button>';
  } else {
    r.innerHTML = 'Aplicativo sem licença · <button class="lnk" id="bLic">Inserir licença</button>';
  }

  render();
}
function htmlLicenca(){

    revogada: "A licença de " + emp + " foi cancelada. Você ainda pode consultar o estoque e fazer backup. Fale com quem forneceu o aplicativo.",
    verificar: "Não foi possível verificar a licença há mais de " + DIAS_SEM_VERIFICAR + " dias. Conecte este computador à internet para voltar a registrar movimentos. O backup continua liberado."
  };
  if(msgs[e]) return '<div class="aviso-backup aviso-erro"><div class="wrap"><span>' + msgs[e] + '</span><button id="bAvisoLic">Ver licença</button></div></div>';
  if(e === "ok" && licEst.dias !== null && licEst.dias <= 7)
    return '<div class="aviso-backup"><div class="wrap"><span>Sua licença vence ' + (licEst.dias <= 1 ? "hoje ou amanhã" : "em " + licEst.dias + " dias") + ' (' + fmtData(lic.validade) + '). Para renovar, fale com quem forneceu o aplicativo.</span><button id="bAvisoLic">Ver licença</button></div></div>';

}
function dialogoLicenca(){
  const e = licEst.estado;
  const SIT = {ok: ["Ativa", "ok"], expirada: ["Vencida", "sem"], revogada: ["Cancelada", "sem"], verificar: ["Verificar online", "repor"], sem: ["Sem licença", "sem"], invalida: ["Inválida", "sem"], semcrypto: ["Não verificável", "sem"], carregando: ["Verificando", "repor"]};
  const s = SIT[e] || SIT.sem;
  const info = lic ? '<div class="licinfo"><span>Empresa</span><b>' + esc(lic.empresa) + '</b><span>Validade</span><b>' + (lic.validade ? fmtData(lic.validade) : "Sem data de validade") + '</b><span>Código</span><b>' + esc(lic.id) + '</b><span>Situação</span><b><span class="selo ' + s[1] + '" style="color:inherit">' + s[0] + '</span></b></div>' : "";
  abrir('<div class="dh"><span class="dic neu">' + ICON("shield") + '</span><div><h2>' + (lic ? "Licença" : "Ativar o aplicativo") + '</h2>' +
    '<p class="sub">' + (podeEditar() ? "Seu aplicativo está liberado." : "Para registrar entradas e baixas, insira a chave de licença que você recebeu. O backup dos seus dados continua liberado.") + '</p></div></div>' + info +
    '<label for="chave">' + (lic ? "Inserir uma nova chave (renovação)" : "Chave de licença") + '</label><textarea id="chave" rows="4" spellcheck="false" autocomplete="off" placeholder="Cole aqui a chave que começa com CE1-"></textarea>' +
    '<p class="erro" id="e" role="alert"></p>' +
    '<div class="botoes"><button type="button" class="btn" data-fechar>Fechar</button><button type="button" class="btn prim" id="bAtivar">Ativar licença</button></div>');
  const err = $("#e");
  $("#bAtivar").onclick = async () => {
    const r = await verificarChave($("#chave").value);
    if(!r.ok){ err.textContent = r.erro; return; }
    const d = r.dados;
    if(d.validade && agoraLic() > fimDoDia(d.validade)){ err.textContent = "Esta licença já venceu em " + fmtData(d.validade) + "."; return; }
    lic = Object.assign({}, d, {chave: r.chave}); licProblema = null;
    lsSet(CHAVE_LIC, r.chave); lsDel(CHAVE_REV); lsSet(CHAVE_VER, String(Date.now()));
    aplicarLicenca(); fechar(); toast("Licença ativada: " + d.empresa + ".");
    checarRevogacao();
  };
}
async function checarRevogacao(){
  if(!lic || !lic.url) return;
  try{
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(lic.url + (lic.url.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store", signal: ctl.signal});
    clearTimeout(t);
    if(!r.ok) return;
    const j = await r.json();
    if(!Array.isArray(j.revogadas)) return;
    lsSet(CHAVE_VER, String(Date.now()));
    if(j.revogadas.includes(lic.id)) lsSet(CHAVE_REV, lic.id); else lsDel(CHAVE_REV);
    const antes = licEst.estado;
    aplicarLicenca();
    if(licEst.estado === "revogada" && antes !== "revogada") dialogoLicenca();
  }catch(e){}
}
async function iniciarLicenca(){
  {
    const chave = lsGet(CHAVE_LIC);
    if(!chave) lic = null;
    else {
      const r = await verificarChave(chave);
      if(r.ok) lic = Object.assign({}, r.dados, {chave}); else { lic = null; licProblema = "invalida"; }
    }
  }
  aplicarLicenca();
  if(licEst.estado === "sem" || licEst.estado === "invalida") dialogoLicenca();
  checarRevogacao();
  setInterval(() => { licEst = calcLic(); if(licEst.estado !== "ok") aplicarLicenca(); checarRevogacao(); }, 3600e3);
  window.addEventListener("online", checarRevogacao);
}

function extraProd(p){ const o = {}, c = String(p.codigo || "").replace(/\D/g, ""); if(c.length >= 6) o.codigo = c; if(Number(p.preco) > 0) o.preco = Number(p.preco); if(Number(p.custo) > 0) o.custo = Number(p.custo); return o; }
function extraMov(v){ const o = {}; if(Number(v.preco) > 0) o.preco = Number(v.preco); if(Number(v.custo) > 0) o.custo = Number(v.custo); return o; }
function normalizarBackup(d){
  if(!d || !Array.isArray(d.produtos) || !Array.isArray(d.movs)) return null;
  const produtos = d.produtos.filter(p => p && String(p.nome || "").trim()).map(p => ({id: Number(p.id), nome: String(p.nome).trim(), unidade: String(p.unidade || "un"), minimo: Number(p.minimo) > 0 ? Number(p.minimo) : 0, fardo: Number(p.fardo) > 0 ? Number(p.fardo) : 0, ...extraProd(p)}));
  const ids = new Set(produtos.map(p => p.id));
  const movs = d.movs.filter(v => v && ids.has(Number(v.pid)) && (v.tipo === "ENTRADA" || v.tipo === "SAIDA") && Number(v.qtd) > 0 && v.ts)
    .map(v => ({ts: String(v.ts), pid: Number(v.pid), tipo: v.tipo, qtd: Number(v.qtd), obs: String(v.obs || ""), fardos: Number(v.fardos) > 0 ? Number(v.fardos) : 0, ...extraMov(v)}));
  return {produtos, movs};
}
function planejarMescla(backups, comMovs){
  const prods = db.produtos.map(p => Object.assign({}, p)), movs = db.movs.slice();
  let seq = db.seq;
  const porNome = new Map(prods.map(p => [p.nome.toLowerCase(), p])), originais = new Set(porNome.keys());
  const nomeDe = new Map(prods.map(p => [p.id, p.nome.toLowerCase()]));
  const chave = (nome, v) => [nome, v.ts, v.tipo, v.qtd, v.obs || ""].join("|");
  const chaves = new Set(movs.map(v => chave(nomeDe.get(v.pid) || "", v)));
  const novos = new Set(), existentes = new Set();
  let novas = 0, repetidas = 0;
  for(const b of backups){
    const mapa = new Map();
    for(const bp of b.produtos){
      const k = bp.nome.toLowerCase();
      let local = porNome.get(k);
      if(!local){
        local = {id: seq++, nome: bp.nome, unidade: bp.unidade, minimo: bp.minimo, fardo: bp.fardo};
        if(bp.codigo && !prods.some(x => x.codigo === bp.codigo)) local.codigo = bp.codigo; if(bp.preco > 0) local.preco = bp.preco; if(bp.custo > 0) local.custo = bp.custo;
        prods.push(local); porNome.set(k, local); nomeDe.set(local.id, k); novos.add(k);
      } else {
        if(originais.has(k) || !novos.has(k)) existentes.add(k);
        if(!(local.fardo > 0) && bp.fardo > 0) local.fardo = bp.fardo;
        if(!(local.preco > 0) && bp.preco > 0) local.preco = bp.preco; if(!(local.custo > 0) && bp.custo > 0) local.custo = bp.custo;
        if(!local.codigo && bp.codigo && !prods.some(x => x.codigo === bp.codigo)) local.codigo = bp.codigo;
      }
      mapa.set(bp.id, local.id);
    }
    if(!comMovs) continue;
    for(const bv of b.movs){
      const pid = mapa.get(bv.pid); if(pid === undefined) continue;
      const k = chave(nomeDe.get(pid), bv);
      if(chaves.has(k)){ repetidas++; continue; }
      chaves.add(k);
      const mv = {id: seq++, ts: bv.ts, pid, tipo: bv.tipo, qtd: bv.qtd, obs: bv.obs};
      if(bv.fardos > 0) mv.fardos = bv.fardos;
      if(bv.preco > 0) mv.preco = bv.preco; if(bv.custo > 0) mv.custo = bv.custo;
      movs.push(mv); novas++;
    }
  }
  movs.sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : a.id - b.id);
  const sal = new Map();
  movs.forEach(v => sal.set(v.pid, arred((sal.get(v.pid) || 0) + (v.tipo === "ENTRADA" ? v.qtd : -v.qtd))));
  const negativos = prods.filter(p => (sal.get(p.id) || 0) < 0).length;
  return {prods, movs, seq, novos: novos.size, existentes: existentes.size, novas, repetidas, negativos};
}
function dialogoMescla(backups, ignorados){

  abrir('<div class="dh"><span class="dic ent">' + ICON("plus") + '</span><div><h2>Adicionar de outro backup</h2><p class="sub">' + backups.length + (backups.length === 1 ? " arquivo lido" : " arquivos lidos") + ' (' + total + ' produtos). Nada do que já existe será apagado.</p></div></div>' +
    (ignorados.length ? '<p class="erro">Não consegui ler: ' + esc(ignorados.join(", ")) + '</p>' : "") +
    '<label class="chk" style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="mcMovs" checked style="width:18px;height:18px;min-height:0;margin:0"> Trazer também as entradas e saídas</label>' +
    '<div class="licinfo" id="mcResumo"></div><p class="prev" id="mcAviso"></p>' +
    '<div class="botoes"><button type="button" class="btn" data-fechar>Cancelar</button><button type="button" class="btn prim" id="mcOk">Adicionar</button></div>');

    $("#mcResumo").innerHTML = '<span>Produtos novos</span><b>' + r.novos + '</b><span>Já cadastrados</span><b>' + r.existentes + ' (mantidos como estão)</b>' +
      ($("#mcMovs").checked ? '<span>Movimentos novos</span><b>' + r.novas + '</b><span>Já existentes</span><b>' + r.repetidas + ' (ignorados, sem duplicar)</b>' : '<span>Movimentos</span><b>Nenhum será trazido</b>');
    $("#mcAviso").textContent = r.negativos ? "Atenção: " + r.negativos + (r.negativos === 1 ? " produto ficaria" : " produtos ficariam") + " com estoque negativo depois de juntar. Confira os backups." : "";
    $("#mcAviso").className = "prev" + (r.negativos ? " neg" : "");
    $("#mcOk").disabled = !r.novos && !r.novas;
    $("#mcOk").textContent = $("#mcOk").disabled ? "Nada novo para adicionar" : "Adicionar";
  };
  $("#mcMovs").onchange = mostrar; mostrar();
  $("#mcOk").onclick = () => {
    if(!podeEditar()){ fechar(); dialogoLicenca(); return; }
    const antes = JSON.stringify(db), r = calc();
    db.produtos = r.prods; db.movs = r.movs; db.seq = r.seq; salvar();
    fechar(); prevSal = new Map(); render("inicial");
    toast("Adicionado: " + r.novos + (r.novos === 1 ? " produto novo" : " produtos novos") + " e " + r.novas + (r.novas === 1 ? " movimento." : " movimentos."), "",
      () => { db = JSON.parse(antes); salvar(); prevSal = new Map(); render("inicial"); toast("Adição desfeita."); });
  };
}
$("#arquivoMescla").addEventListener("change", async e => {
  const arqs = Array.from(e.target.files); e.target.value = "";
  if(!arqs.length) return;
  if(!podeEditar()){ dialogoLicenca(); return; }
  const ok = [], ruins = [];
  for(const f of arqs){
    try{ const n = normalizarBackup(JSON.parse(await f.text())); if(n) ok.push(n); else ruins.push(f.name); }
    catch(err){ ruins.push(f.name); }
  }
  if(!ok.length){ toast("Nenhum desses arquivos é um backup válido deste aplicativo.", "erro"); return; }
  dialogoMescla(ok, ruins);
});

function sha256js(m){
  const h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  const dv = new DataView(b.buffer); dv.setUint32(tot - 8, Math.floor(n / 0x20000000)); dv.setUint32(tot - 4, (n << 3) >>> 0);
  const w = new Uint32Array(64), rr = (x, k) => (x >>> k) | (x << (32 - k));
  for(let o = 0; o < tot; o += 64){
    for(let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for(let i = 16; i < 64; i++){ const a = w[i-15], c = w[i-2]; w[i] = (w[i-16] + (rr(a,7) ^ rr(a,18) ^ (a >>> 3)) + w[i-7] + (rr(c,17) ^ rr(c,19) ^ (c >>> 10))) >>> 0; }
    let [a, bb, c, d, e, f, g, hh] = h;
    for(let i = 0; i < 64; i++){
      const t1 = (hh + (rr(e,6) ^ rr(e,11) ^ rr(e,25)) + ((e & f) ^ (~e & g)) + SHA_K[i] + w[i]) >>> 0;
      const t2 = ((rr(a,2) ^ rr(a,13) ^ rr(a,22)) + ((a & bb) ^ (a & c) ^ (bb & c))) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
    }
    [a, bb, c, d, e, f, g, hh].forEach((v, i) => { h[i] = (h[i] + v) >>> 0; });
  }
  const out = new Uint8Array(32), ov = new DataView(out.buffer); h.forEach((v, i) => ov.setUint32(i * 4, v));
  return out;

const P256 = {p: 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffffn, n: 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551n,
  gx: 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296n, gy: 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5n};
const bmod = (a, m) => { const r = a % m; return r >= 0n ? r : r + m; };
function binv(a, m){ let [r0, r1] = [bmod(a, m), m], [s0, s1] = [1n, 0n]; while(r1){ const q = r0 / r1; [r0, r1] = [r1, r0 - q * r1]; [s0, s1] = [s1, s0 - q * s1]; } return bmod(s0, m); }
function pAdd(A, B){
  const p = P256.p; if(!A) return B; if(!B) return A;
  let l;
  if(A[0] === B[0]){ if(bmod(A[1] + B[1], p) === 0n) return null; l = bmod((3n * A[0] * A[0] - 3n) * binv(2n * A[1], p), p); }
  else l = bmod((B[1] - A[1]) * binv(B[0] - A[0], p), p);
  const x = bmod(l * l - A[0] - B[0], p);
  return [x, bmod(l * (A[0] - x) - A[1], p)];
}
function pMul(k, P){ let R = null, Q = P; while(k > 0n){ if(k & 1n) R = pAdd(R, Q); Q = pAdd(Q, Q); k >>= 1n; } return R; }

function ecdsaVerifyJs(spki, msg, sig){
  if(sig.length !== 64) return false;
  const n = P256.n, Q = [bytesBig(spki.slice(-64, -32)), bytesBig(spki.slice(-32))];
  const r = bytesBig(sig.slice(0, 32)), s = bytesBig(sig.slice(32));
  if(r <= 0n || r >= n || s <= 0n || s >= n) return false;
  const z = bytesBig(sha256js(msg)), w = binv(s, n);
  const pt = pAdd(pMul(bmod(z * w, n), [P256.gx, P256.gy]), pMul(bmod(r * w, n), Q));
  return !!pt && bmod(pt[0], n) === r;
}

const CH_SYNC = "controle-estoque-sync";
function lerSync(){ try{ const j = JSON.parse(localStorage.getItem(CH_SYNC) || "null"); if(j && j.url && j.codigo && j.base) return j; }catch(e){} return null; }
let sy = lerSync(), syOcupado = false, syTimer = null, syEst = {tipo: "ok", txt: ""}, syDetectado = "";
function gravaSync(){ try{ if(sy) localStorage.setItem(CH_SYNC, JSON.stringify(sy)); else localStorage.removeItem(CH_SYNC); }catch(e){} }
function salvarSemSync(){ try{ localStorage.setItem(CHAVE, JSON.stringify(db)); salvoOk = true; }catch(e){ salvoOk = false; } }
function agendarSync(){ if(!sy) return; clearTimeout(syTimer); syTimer = setTimeout(syncAgora, 350); }
async function syPost(url, codigo, caminho, corpo){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(url + caminho, {method: "POST", headers: {"Content-Type": "application/json", "X-Codigo": codigo}, body: JSON.stringify(corpo), signal: ctl.signal, cache: "no-store"});
    if(r.status === 401){ const e = new Error("codigo"); e.codigo = true; throw e; }
    if(!r.ok) throw new Error("http " + r.status);
    return await r.json();
  }finally{ clearTimeout(t); }
}
function syOps(){
  const ops = [], envP = {}, envM = new Set(), bp = sy.base.p, bm = sy.base.m, vp = new Set(), vm = new Set();
  for(const p of db.produtos){ const j = JSON.stringify(p), id = String(p.id); vp.add(id); envP[id] = j; if(bp[id] !== j) ops.push({t: "p", id, d: p}); }
  for(const id in bp) if(!vp.has(id)) ops.push({t: "p", id, del: true});
  for(const v of db.movs){ const id = String(v.id); vm.add(id); envM.add(id); if(!bm[id]) ops.push({t: "m", id, d: v}); }
  for(const id in bm) if(!vm.has(id)) ops.push({t: "m", id, del: true});
  return {ops, envP, envM};
}
function syMostrar(tipo, txt){
  if(tipo) syEst = {tipo, txt};
  const b = $("#syChip"); if(!b) return;
  if(!sy){ b.className = "sychip"; b.textContent = ""; return; }
  b.className = "sychip on " + (syEst.tipo === "ok" ? "" : syEst.tipo);
  b.innerHTML = "<i></i>" + esc("Compartilhado · " + (syEst.txt || "conectando…"));
  const t = $("#syTxt"); if(t) t.textContent = syEst.txt || "conectando…";
}
function syAplicar(r, envP, envM){
  let mudou = false;
  const movs = new Map(db.movs.map(v => [String(v.id), v]));
  for(const c of r.changes){
    if(c.t === "p"){
      const i = db.produtos.findIndex(p => String(p.id) === c.id), atual = i >= 0 ? JSON.stringify(db.produtos[i]) : undefined;
      if(atual !== envP[c.id]) continue;               /* o aparelho mexeu nele durante o envio: vale o que está aqui e vai no próximo envio */
      if(c.del){ if(i >= 0){ db.produtos.splice(i, 1); mudou = true; } delete sy.base.p[c.id]; }
      else if(c.d){ if(i >= 0) db.produtos[i] = c.d; else db.produtos.push(c.d); sy.base.p[c.id] = JSON.stringify(c.d); if(atual !== sy.base.p[c.id]) mudou = true; }
    }else if(c.t === "m"){
      const ex = movs.get(c.id);
      if(c.del){ if(ex){ db.movs.splice(db.movs.indexOf(ex), 1); mudou = true; } delete sy.base.m[c.id]; }
      else if(c.d){
        sy.base.m[c.id] = 1;
        if(!ex && !envM.has(c.id)){ db.movs.push(c.d); mudou = true; }
      }
    }
  }
  sy.cursor = r.rev;
  return mudou;
}
async function syLicenca(chave){
  if(!chave || (lic && lic.chave === chave)) return;

  const d = v.dados;
  if(lic && licEst.estado === "ok" && !(String(d.emitida || "") > String(lic.emitida || ""))) return;
  if(d.validade && agoraLic() > fimDoDia(d.validade)) return;
  const antes = licEst.estado;
  lic = Object.assign({}, d, {chave: v.chave}); licProblema = null;
  lsSet(CHAVE_LIC, v.chave); lsDel(CHAVE_REV); lsSet(CHAVE_VER, String(Date.now()));
  aplicarLicenca();
  if(antes !== "ok" && licEst.estado === "ok" && dlg.open && dlg.querySelector("#chave")) fechar();
  toast("Licença recebida do servidor: " + d.empresa + ".");
}
async function syncAgora(){
  if(!sy || syOcupado) return;
  syOcupado = true; clearTimeout(syTimer);
  try{
    const {ops, envP, envM} = syOps();
    if(ops.length) syMostrar("aviso", "enviando " + ops.length + (ops.length === 1 ? " alteração…" : " alterações…"));
    const r = await syPost(sy.url, sy.codigo, "/api/sync", {cursor: sy.cursor, sid: sy.sid || "", ops, licenca: (lic && licEst.estado === "ok") ? lic.chave : ""});
    if(r.reset){ sy.sid = r.sid; sy.cursor = 0; sy.base = {p: {}, m: {}}; gravaSync(); syOcupado = false; return syncAgora(); }
    sy.sid = r.sid;
    const mudou = syAplicar(r, envP, envM);
    gravaSync();
    if(mudou){ salvarSemSync(); render(); }
    syMostrar("ok", "sincronizado " + new Date().toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"}));
    syLicenca(r.licenca);
  }catch(e){
    if(e && e.codigo) syMostrar("err", "código de acesso recusado. Toque para corrigir");
    else { let n = 0; try{ n = syOps().ops.length; }catch(x){} syMostrar("aviso", "sem conexão" + (n ? " · " + n + " aguardando" : "")); }
  }finally{ syOcupado = false; }
}

/* ---------- QR code (sem bibliotecas; texto em bytes, correção M, versões 1 a 10) ---------- */
const QR = (() => {
  const ECC = [0,10,16,26,18,24,16,18,22,22,26], BLK = [0,1,1,2,2,4,4,4,5,5,5];

    let div = new Array(d).fill(0); div[d - 1] = 1; let raiz = 1;
    for(let i = 0; i < d; i++){ for(let j = 0; j < d; j++){ div[j] = mul(div[j], raiz); if(j + 1 < d) div[j] ^= div[j + 1]; } raiz = mul(raiz, 2); }
    const res = new Array(d).fill(0);
    for(const b of dados){ const f = b ^ res.shift(); res.push(0); for(let i = 0; i < d; i++) res[i] ^= mul(div[i], f); }
    return res;
  }
  function gerar(texto){
    const bytes = Array.from(new TextEncoder().encode(texto));
    let ver = 1;
    for(; ver <= 10; ver++){ if(4 + (ver <= 9 ? 8 : 16) + bytes.length * 8 <= dataCap(ver) * 8) break; }
    if(ver > 10) return null;
    const bits = []; const put = (v, n) => { for(let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, ver <= 9 ? 8 : 16); bytes.forEach(b => put(b, 8));

/* ---------- leitura por foto e código de barras ---------- */
let codigoPendente = "";
const semAcento = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/(\d)([a-z])/g, "$1 $2").replace(/([a-z])(\d)/g, "$1 $2").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function achaProduto(nome, codigo){
  const c = String(codigo || "").replace(/\D/g, "");
  if(c){ const p = db.produtos.find(x => x.codigo && x.codigo === c); if(p) return p; }
  const a = semAcento(nome); if(!a) return null;
  const ta = new Set(a.split(" ")); let melhor = null, nota = 0;
  for(const p of db.produtos){
    const b = semAcento(p.nome); if(b === a) return p;
    const tb = new Set(b.split(" ")); let inter = 0; ta.forEach(t => { if(tb.has(t)) inter++; });
    const n = inter / Math.max(ta.size, tb.size, 1);
    if(n > nota){ nota = n; melhor = p; }
  }
  if(nota >= 0.6) return melhor;
  /* nome curto da lista (ex.: "açúcar") dentro do nome completo do cadastro ("Açúcar 1 kg"): só vale se for único */
  const semNum = new Set([...ta].filter(t => !/^\d+$/.test(t)));
  if(!semNum.size) return null;
  const cand = db.produtos.filter(p => { const tb = new Set(semAcento(p.nome).split(" ")); return [...semNum].every(t => tb.has(t)); });
  return cand.length === 1 ? cand[0] : null;
}

/* --- leitor de código de barras (EAN-13, EAN-8 e UPC-A) --- */
const PADROES_L = [[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const PADROES_G = PADROES_L.map(p => p.slice().reverse());
const PARIDADE = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function casaDigito(w, usaG){
  const soma = w[0] + w[1] + w[2] + w[3]; if(soma < 4) return null;
  const u = soma / 7, n = w.map(x => x / u);
  let melhor = null;
  const tenta = (pad, tipo) => pad.forEach((p, d) => {
    let e = 0; for(let k = 0; k < 4; k++) e += (n[k] - p[k]) * (n[k] - p[k]);
    if(!melhor || e < melhor.e) melhor = {d, tipo, e};
  });
  tenta(PADROES_L, "L"); if(usaG) tenta(PADROES_G, "G");
  return melhor && melhor.e < 1.1 ? melhor : null;
}
function decodaEAN(runs, i, m, tipo){
  const meia = tipo === 13 ? 6 : 4, total = 3 + meia * 4 + 5 + meia * 4 + 3;
  if(i + total > runs.length) return null;
  let p = i + 3; const esq = [], dir = []; let tipos = "";
  for(let k = 0; k < meia; k++){ const r = casaDigito(runs.slice(p, p + 4), tipo === 13); if(!r) return null; esq.push(r.d); tipos += r.tipo; p += 4; }
  for(let k = 0; k < 5; k++){ if(Math.abs(runs[p + k] - m) > m * 0.95) return null; }
  p += 5;
  for(let k = 0; k < meia; k++){ const r = casaDigito(runs.slice(p, p + 4), false); if(!r) return null; dir.push(r.d); p += 4; }
  let dig;
  if(tipo === 13){ const pr = PARIDADE.indexOf(tipos); if(pr < 0) return null; dig = [pr].concat(esq, dir); }
  else { if(tipos !== "LLLL") return null; dig = esq.concat(dir); }
  let s = 0; const n = dig.length - 1;
  for(let k = 0; k < n; k++) s += dig[k] * ((tipo === 13 ? k % 2 === 1 : k % 2 === 0) ? 3 : 1);
  if((10 - s % 10) % 10 !== dig[n]) return null;
  return dig.join("");
}
function decodaLinha(g){
  const n = g.length; if(n < 40) return null;
  const ord = Float32Array.from(g).sort(), lo = ord[Math.floor(n * 0.05)], hi = ord[Math.floor(n * 0.95)];
  if(hi - lo < 40) return null;
  const t = (lo + hi) / 2, runs = []; let atual = g[0] < t, cnt = 0; const primeira = atual;
  for(let x = 0; x < n; x++){ const e = g[x] < t; if(e === atual) cnt++; else { runs.push(cnt); atual = e; cnt = 1; } }
  runs.push(cnt);
  for(let i = 1; i + 3 < runs.length; i++){
    if(((i % 2) === 0) !== primeira) continue;
    const a = runs[i], b = runs[i + 1], c = runs[i + 2], m = (a + b + c) / 3;
    if(m < 1.2 || Math.abs(a - m) > m * 0.6 || Math.abs(b - m) > m * 0.6 || Math.abs(c - m) > m * 0.6) continue;
    if(runs[i - 1] < m * 3) continue;
    for(const tipo of [13, 8]){ const r = decodaEAN(runs, i, m, tipo); if(r) return r; }
  }
  return null;
}
function decodaCanvas(cv){
  const w = cv.width, h = cv.height, ctx = cv.getContext("2d", {willReadFrequently: true});
  const ys = [0.5, 0.45, 0.55, 0.4, 0.6, 0.35, 0.65, 0.3, 0.7, 0.25, 0.75, 0.2, 0.8];
  for(const f of ys){
    const px = ctx.getImageData(0, Math.min(h - 1, Math.round(h * f)), w, 1).data, g = new Float32Array(w);
    for(let x = 0; x < w; x++) g[x] = 0.299 * px[x * 4] + 0.587 * px[x * 4 + 1] + 0.114 * px[x * 4 + 2];
    const lisa = new Float32Array(w);
    for(let x = 0; x < w; x++) lisa[x] = (g[Math.max(0, x - 1)] + g[x] + g[Math.min(w - 1, x + 1)]) / 3;
    const r = decodaLinha(lisa) || decodaLinha(Float32Array.from(lisa).reverse());
    if(r) return r;
  }
  return null;
}
let detNativo;
async function detectorNativo(){
  if(detNativo !== undefined) return detNativo;
  detNativo = null;
  try{
    if("BarcodeDetector" in window){
      const f = await BarcodeDetector.getSupportedFormats(), q = ["ean_13", "ean_8", "upc_a", "upc_e"].filter(x => f.includes(x));
      if(q.length) detNativo = new BarcodeDetector({formats: q});
    }
  }catch(e){}
  return detNativo;
}
async function lerBarras(cv){
  const d = await detectorNativo();
  if(d){ try{ const r = await d.detect(cv); if(r.length && r[0].rawValue) return r[0].rawValue; }catch(e){} }
  return decodaCanvas(cv);
}
function imagemParaCanvas(img, max){
  const esc = Math.min(1, max / Math.max(img.width || img.videoWidth, img.height || img.videoHeight));
  const cv = document.createElement("canvas");
  cv.width = Math.round((img.width || img.videoWidth) * esc); cv.height = Math.round((img.height || img.videoHeight) * esc);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return cv;
}
function carregarImagem(file){
  return new Promise((ok, erro) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("Não consegui abrir essa imagem.")); };
    img.src = url;
  });
}

async function lerFotoWeb(sm, base64){

/* --- lista colada / digitada (sem IA, sem internet) --- */
const UNID_RX = "kg|g|ml|l|lt|lts|litros?|un|unid|unids|unidades?|pcs?|pe[cç]as?|cx|caixas?|pct|pcts|pacotes?|fardos?|fd|fds|dz|d[uú]zias?";
function unidNorm(u){
  u = semAcento(u || "");
  if(!u) return {un: "", fardo: false};
  if(/^(fardos?|fd|fds)$/.test(u)) return {un: "un", fardo: true};
  if(/^(l|lt|lts|litros?)$/.test(u)) return {un: "l", fardo: false};
  if(/^(un|unid|unids|unidades?|pcs?|pecas?)$/.test(u)) return {un: "un", fardo: false};
  if(/^(cx|caixas?)$/.test(u)) return {un: "cx", fardo: false};
  if(/^(pct|pcts|pacotes?)$/.test(u)) return {un: "pct", fardo: false};
  if(/^(dz|duzias?)$/.test(u)) return {un: "dz", fardo: false};
  return {un: u, fardo: false};
}
function lerLista(texto){
  const itens = [], ignoradas = [];
  const reL = new RegExp("^(\\d+(?:[.,]\\d+)?)\\s*(?:x\\s+|x(?=\\s))?\\s*(" + UNID_RX + ")?(?![a-zà-ú0-9])\\s*(?:de\\s+)?(.+)$", "i");
  const reT = new RegExp("^(.+?)[\\s:;,=–-]+(?:x\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(" + UNID_RX + ")?$", "i");
  for(let linha of String(texto || "").split(/\r?\n/)){
    linha = linha.replace(/\t/g, " ; ").replace(/^\s*[-•*·]+\s+/, "").trim();
    if(!linha) continue;
    let nome, q, u = "";
    let m = linha.match(reL);
    if(m){ q = m[1]; u = m[2] || ""; nome = m[3]; }
    else if((m = linha.match(reT))){ nome = m[1]; q = m[2]; u = m[3] || ""; }
    else { ignoradas.push(linha); continue; }
    nome = nome.replace(/^[\s;:,=–-]+|[\s;:,=–-]+$/g, "").replace(/\s+/g, " ");
    q = Number(String(q).replace(",", "."));
    if(!nome || !(q > 0) || /^\d+$/.test(nome)){ ignoradas.push(linha); continue; }
    const n = unidNorm(u);
    itens.push({nome: nome.slice(0, 60), quantidade: q, unidade: n.un || "un", emFardos: n.fardo, codigo: ""});
  }
  return {itens, ignoradas};
}

let balModo = "mes", balRef = (() => { const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); return d; })();
const MESES_L = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const MESES_C = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
let balMed = "qtd";
function dadosBalanco(){
  const y = balRef.getFullYear(), mo = balRef.getMonth(), ano = balModo === "ano";
  const py = ano ? y - 1 : (mo === 0 ? y - 1 : y), pm = mo === 0 ? 11 : mo - 1;
  const noPer = (d, yy, mm) => d.getFullYear() === yy && (ano || d.getMonth() === mm);
  const n = ano ? 12 : new Date(y, mo + 1, 0).getDate(), z = () => new Array(n).fill(0);
  const ent = z(), sai = z(), entV = z(), saiV = z(), por = new Map(); let prevSai = 0, prevEnt = 0, prevV = 0, lucro = 0, lucroOk = false, semPreco = 0;
  db.produtos.forEach(p => por.set(p.id, {p, e: 0, s: 0, v: 0, c: 0}));
  for(const m of db.movs){
    const r = por.get(m.pid); if(!r) continue;
    const d = new Date(m.ts), q = Number(m.qtd) || 0, inicial = m.obs === "Estoque inicial", saida = m.tipo === "SAIDA";
    const pr = m.preco > 0 ? m.preco : (saida ? r.p.preco : r.p.custo) || 0, val = q * pr;
    if(noPer(d, y, mo)){
      const i = ano ? d.getMonth() : d.getDate() - 1;
      if(saida){
        sai[i] += q; r.s += q; saiV[i] += val; r.v += val; if(!(pr > 0)) semPreco++;

    } else if(noPer(d, py, pm)){ if(saida){ prevSai += q; prevV += val; } else if(!inicial) prevEnt += q; }
  }
  const soma = a => a.reduce((x, v) => x + v, 0);
  let estoqueV = 0, temPreco = false;
  db.produtos.forEach(p => { const u = p.custo > 0 ? p.custo : (p.preco || 0); if(u > 0){ temPreco = true; estoqueV += Math.max(0, saldoDe(p.id)) * u; } if(p.preco > 0 || p.custo > 0) temPreco = true; });

}
function bonito(max){ if(max <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(max))), f = max / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }
